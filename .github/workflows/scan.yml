name: Telegram Group Scanner

on:
  schedule:
    - cron: '0 8 * * *'  # Daily at 9:00 CET (8:00 UTC)
  workflow_dispatch:       # Manual trigger

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python scanner.py

      - name: Run enricher
        if: hashFiles('leads.json') != ''
        run: python enricher.py

      - name: Upload leads data as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leads-${{ github.run_number }}
          path: |
            leads.json
            enriched_leads.json
          retention-days: 30
